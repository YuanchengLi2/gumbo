[project]
name = "dream-ingest"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "soundfile==0.13.1", "scenedetect[opencv]==0.6.7.1", "mediapipe==1.0.1", "transformers==4.56.2", "torch==2.8.0", "whisperx==3.8.6", "pyannote.audio==4.0.0", "pillow==11.3.0"]
[project.scripts]
dream-ingest = "dream_ingest.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/dream_ingest"]

[dependency-groups]
dev = [
    "pyinstaller==6.16.0",
]
