<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Launch review</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Launch review</h1>
<p>A page that plays sound: a recording (generated here, or ?src=), or a call (a stream, like WebRTC's).</p>
<audio id="media" controls></audio>
<p><button id="play">Play</button> <button id="call">Join call</button></p>
<script>
// A 24-second tone that comes and goes, like speech: loud enough to be heard, nothing to understand.
function wav(seconds){
 const rate=16000,n=rate*seconds,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const t=i/rate,s=t%1<0.8?0.3*Math.sin(2*Math.PI*220*t)*(0.6+0.4*Math.sin(2*Math.PI*3*t)):0;v.setInt16(44+i*2,Math.round(s*32767),true);}
 return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
const media=document.getElementById('media'),src=new URLSearchParams(location.search).get('src');
media.src=src||wav(24);
document.getElementById('play').onclick=()=>media.play();
document.getElementById('call').onclick=()=>{
 const ctx=new AudioContext(),tone=ctx.createOscillator(),gain=ctx.createGain(),out=ctx.createMediaStreamDestination();
 gain.gain.value=0.3;tone.connect(gain).connect(out);tone.start();
 media.removeAttribute('src');media.srcObject=out.stream;media.play();
};
</script>
</body>
</html>
