<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>New event - Calendar</title><link rel="stylesheet" href="../style.css"></head>
<body>
<main>
 <h1>New event</h1>
 <form onsubmit="event.preventDefault();document.getElementById('status').textContent='Saved';">
  <label for="title">Add title</label><input id="title">
  <label for="when">Date and time</label><input id="when">
  <label for="where">Add location</label><input id="where">
  <button type="submit">Save</button>
 </form>
 <p id="status"></p>
</main>
</body>
</html>
