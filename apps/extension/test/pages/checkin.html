<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Online check-in</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
 <h1>Online check-in</h1>
 <p>Find your trip to check in and choose your seat.</p>
 <form onsubmit="event.preventDefault();document.getElementById('status').textContent='Looking up '+document.getElementById('flight').value;">
  <label for="flight">Flight number</label><input id="flight" autocomplete="off">
  <label for="date">Departure date</label><input id="date" autocomplete="off">
  <button type="submit">Find my trip</button>
 </form>
 <p id="status"></p>
</main>
</body>
</html>
