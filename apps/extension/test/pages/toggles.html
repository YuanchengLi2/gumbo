<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in settings</title><link rel="stylesheet" href="style.css">
<style>
 /* A checkbox the page hides and draws itself, as most sites do: the native box is a pixel off to the side. */
 .toggle input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
 .toggle span{display:inline-block;padding:8px 14px;border:1px solid #bbb;border-radius:18px;cursor:pointer}
 .toggle input:checked+span{background:#111;color:#fff}
</style></head>
<body>
<main>
 <h1>Sign in settings</h1>
 <label class="toggle" id="remember-label"><input type="checkbox" id="remember"><span>Remember me on this computer</span></label>
 <p id="status"></p>
</main>
<script>document.getElementById('remember').onchange=e=>{document.getElementById('status').textContent=e.target.checked?'Remembered':'';};</script>
</body>
</html>
