project_id = "dream-desktop"
[auth]
enable_anonymous_sign_ins = false
site_url = "https://usegumbo.app"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:**/callback**"]
[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
[auth.email.template.magic_link]
subject = "Sign in to Gumbo"
content_path = "./supabase/templates/sign-in.html"
[auth.email.template.confirmation]
subject = "Sign in to Gumbo"
content_path = "./supabase/templates/sign-in.html"
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[functions.dream-gateway]
verify_jwt = false
