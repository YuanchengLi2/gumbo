<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Figjam sign-in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='26' fill='%23111'/></svg>">
<style>
/* usegumbo.app is only Figjam's sign-in: its home says where to start and links to the product's own site. */
:root{--ink:#111;--muted:#666;--bg:#fafafa}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2f2;--muted:#9a9a9a;--bg:#0c0c0c}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);text-align:center}
h1{margin:0 0 8px;font-size:22px}p{margin:0;color:var(--muted);line-height:1.55}a{color:var(--ink)}
</style>
</head>
<body>
<main>
 <h1>Figjam sign-in</h1>
 <p>To sign in, open the Figjam app and choose Sign in.<br>Learn about Figjam at <a href="https://usefigjam.com">usefigjam.com</a>.</p>
</main>
</body>
</html>
